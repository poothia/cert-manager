# Lab 4 - Step 2: Create a trust-manager Bundle
#
# This Bundle sources the CA certificate from the root-ca-secret (created in Lab 1)
# and distributes it as a ConfigMap named "workshop-ca-bundle" to every namespace
# that has the label trust.cert-manager.io/inject: "true".
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: workshop-ca-bundle
spec:
  sources:
    - secret:
        name: root-ca-secret
        key: ca.crt
  target:
    configMap:
      key: ca-bundle.crt
    namespaceSelector:
      matchLabels:
        trust.cert-manager.io/inject: "true"
