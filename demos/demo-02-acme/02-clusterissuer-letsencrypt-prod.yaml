# Demo 2 (Reference): Let's Encrypt PRODUCTION ClusterIssuer
#
# Only switch to this after confirming staging works correctly.
# Production certificates ARE trusted by browsers.
# Rate limits apply: https://letsencrypt.org/docs/rate-limits/
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com       # Replace with your email
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
