# Demo 2: DNS API token Secret for ACME DNS-01 solver
#
# This example uses Cloudflare. Replace with your actual API token.
# For AWS Route53, you would use a different secret format and solver config.
#
# IMPORTANT: Replace <YOUR-CLOUDFLARE-API-TOKEN> with a real token before applying.
#            Never commit real tokens to version control.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "<YOUR-CLOUDFLARE-API-TOKEN>"
