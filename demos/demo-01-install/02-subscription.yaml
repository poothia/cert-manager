# Demo 1 - Step 3: Subscribe to the cert-manager Operator for Red Hat OpenShift
# Channel: stable-v1 (tracks the latest supported release)
# Approval: Automatic (operator upgrades are applied without manual approval)
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-cert-manager-operator
  namespace: cert-manager-operator
spec:
  channel: stable-v1
  installPlanApproval: Automatic
  name: openshift-cert-manager-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
